<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Renu's Collections - Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      (function() {
        // Clean single-page application redirect
        var l = window.location;
        // If query parameters or path are malformed with ~and~ or ?/, redirect cleanly
        if (l.search && (l.search.includes('~and~') || l.search.startsWith('?/'))) {
          window.location.replace('/');
          return;
        }
        window.location.replace('/');
      })();
    </script>
  </head>
  <body></body>
</html>
