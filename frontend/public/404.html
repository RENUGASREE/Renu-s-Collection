<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Renu's Collections</title>
    <meta name="robots" content="noindex" />
    <script>
      (function() {
        var l = window.location;
        // Clean out malformed exploit queries
        if (l.search && (l.search.includes('~and~') || l.search.startsWith('?/'))) {
          window.location.replace('/');
          return;
        }
        // Preserve the full path, search parameters, and hash
        var intended = l.pathname + l.search + l.hash;
        if (intended && intended !== '/' && !intended.endsWith('/404.html')) {
          try {
            sessionStorage.setItem('spa_fallback_redirect', intended);
          } catch (e) {}
        }
        window.location.replace('/');
      })();
    </script>
  </head>
  <body></body>
</html>
